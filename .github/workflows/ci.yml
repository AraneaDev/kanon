name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Linux and macOS both run the suite. The hook scripts are POSIX shell and
    # the tests spawn them through `sh`, so the differences that bite here are
    # shell differences, not Bun ones. Windows is deliberately absent: the
    # hooks would need Git Bash, nothing has been tested there, and the README
    # does not claim it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Report the platform's shell
        # Recorded on every run because the hot path is POSIX shell and /bin/sh
        # is dash on Ubuntu and bash-in-posix-mode on macOS. When a hook test
        # fails on one platform only, this line is the first thing to read.
        run: |
          echo "uname:    $(uname -s)"
          echo "/bin/sh:  $(readlink -f /bin/sh 2>/dev/null || echo '/bin/sh')"
          echo "bun:      $(bun --version)"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is available
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "using preinstalled $(shellcheck --version | grep version:)"
            exit 0
          fi
          version=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${version}/shellcheck"
          shellcheck --version | grep version:

      - name: Syntax check
        run: |
          for f in hooks/scripts/*.sh; do
            sh -n "$f" && echo "ok  $f"
          done

      - name: shellcheck
        # The hooks target POSIX sh rather than bash, so the shell is declared
        # here rather than relying on a shebang guess. -S style is the same
        # bar the other repositories in this marketplace hold.
        run: shellcheck -s sh -S style hooks/scripts/*.sh

      - name: The hooks can never fail a session
        # Kanon's contract is that no hook exits non-zero, because a hook that
        # does can interrupt somebody's session. Cheap to assert, and the kind
        # of thing a refactor silently breaks.
        run: |
          status=0
          for f in hooks/scripts/*.sh; do
            for payload in '' 'not json at all' '{"session_id":"ci","hook_event_name":"Test","cwd":"/tmp"}'; do
              printf '%s' "$payload" \
                | KANON_HOME="$(mktemp -d)" CLAUDE_PLUGIN_ROOT="$PWD" sh "$f" >/dev/null 2>&1
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "FAIL $f exited $rc on payload: ${payload:-<empty>}"
                status=1
              fi

              # Again with CLAUDE_PLUGIN_ROOT unset. Every run above supplies
              # it, which is what let two hooks ship a `set -u` abort on an
              # unbound variable: the shell exits non-zero before the `exit 0`
              # at the foot of the script can run. The environment belongs to
              # Claude Code rather than to Kanon, so it is not Kanon's to
              # assume.
              printf '%s' "$payload" \
                | env -u CLAUDE_PLUGIN_ROOT KANON_HOME="$(mktemp -d)" sh "$f" >/dev/null 2>&1
              rc=$?
              if [ "$rc" -ne 0 ]; then
                echo "FAIL $f exited $rc with CLAUDE_PLUGIN_ROOT unset, payload: ${payload:-<empty>}"
                status=1
              fi
            done
            echo "ok   $f exits 0 on every payload, set or unset plugin root"
          done
          exit $status

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          for f in .claude-plugin/plugin.json hooks/hooks.json package.json; do
            jq -e . "$f" > /dev/null && echo "$f ok"
          done

      - name: Hook commands point at files that exist
        # Guards the failure mode a rename introduces: hooks.json still parses
        # but names a script that is no longer there, and the plugin silently
        # does nothing. This exact failure cost 198 silent exit-127 hook runs
        # in a sibling plugin before anyone noticed.
        run: |
          status=0
          while read -r script; do
            path="${script#\$CLAUDE_PLUGIN_ROOT/}"
            if [ -f "$path" ]; then
              echo "ok   $path"
            else
              echo "MISSING $path"
              status=1
            fi
          done < <(jq -r '.hooks[][].hooks[].command | scan("\\$CLAUDE_PLUGIN_ROOT/[^\"]+")' hooks/hooks.json)
          exit $status

      - name: Versions agree across the manifests
        run: |
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          pkg=$(jq -r .version package.json)
          echo "plugin.json: $plugin / package.json: $pkg"
          [ "$plugin" = "$pkg" ]


  docs:
    # The README goes stale silently. It has already drifted twice during this
    # project: a sample report showed an annotation the code cannot emit, and
    # the column offsets did not match what render actually prints.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check the README against the code
        run: bash tools/check-docs.sh
